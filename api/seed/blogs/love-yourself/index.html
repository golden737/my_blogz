<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Love Yourself</title>
  <meta name="description" content="El impacto de una campaña global en la autoestima juvenil.">
  <style>
    :root { color-scheme: light; --ink:#222; --line:#dedede; --red:#b92736; --paper:#f7f6f3; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial,Helvetica,sans-serif; }
    .platform-bar { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:14px clamp(16px,4vw,48px); background:#fff; border-bottom:1px solid var(--line); }
    .platform-brand { font-weight:700; text-decoration:none; color:#222; }
    .platform-brand:before { content:""; display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--red); margin-right:9px; }
    .back { color:var(--red); font-size:.92rem; text-decoration:none; font-weight:700; }
    main { width:min(100%,1100px); margin:0 auto; padding:26px clamp(10px,3vw,28px) 52px; }
    .page { margin:0 auto 28px; padding:0; background:white; border:1px solid #e3e0dc; border-radius:3px; overflow:hidden; box-shadow:0 8px 28px #0000000a; }
    .page img { display:block; width:100%; height:auto; }
    footer { padding:22px clamp(16px,4vw,48px); display:flex; align-items:center; justify-content:space-between; gap:1rem; background:#fff; border-top:1px solid var(--line); color:#626262; font-size:.88rem; }
    footer a { color:var(--red); text-decoration:none; font-weight:700; }
    @media(max-width:600px) { .platform-bar { padding:12px 14px; } main { padding:12px 8px 28px; } .page { margin-bottom:12px; } footer { padding:16px 14px; } }
  </style>
</head>
<body>
  <header class="platform-bar">
    <a class="platform-brand" href="../../">My Blogs</a>
    <a class="back" href="../../">← Volver al inicio</a>
  </header>
  <main aria-label="Presentación Love Yourself completa">
    <figure class="page"><img src="assets/pages/pagina-01.jpg" alt="Portada: campaña Love Yourself, el impacto de una campaña global en la autoestima juvenil" loading="eager"></figure>
    <figure class="page"><img src="assets/pages/pagina-02.jpg" alt="Página 2: índice" loading="lazy"></figure>
    <figure class="page"><img src="assets/pages/pagina-03.jpg" alt="Página 3: introducción" loading="lazy"></figure>
    <figure class="page"><img src="assets/pages/pagina-04.jpg" alt="Página 4: tesis" loading="lazy"></figure>
    <figure class="page"><img src="assets/pages/pagina-05.jpg" alt="Página 5: origen de la campaña" loading="lazy"></figure>
    <figure class="page"><img src="assets/pages/pagina-06.jpg" alt="Página 6: influencia en los jóvenes" loading="lazy"></figure>
    <figure class="page"><img src="assets/pages/pagina-07.jpg" alt="Página 7: el mensaje de Speak Yourself" loading="lazy"></figure>
    <figure class="page"><img src="assets/pages/pagina-08.jpg" alt="Página 8: alcance mundial" loading="lazy"></figure>
    <figure class="page"><img src="assets/pages/pagina-09.jpg" alt="Página 9: críticas y desafíos" loading="lazy"></figure>
    <figure class="page"><img src="assets/pages/pagina-10.jpg" alt="Página 10: conclusión" loading="lazy"></figure>
    <figure class="page"><img src="assets/pages/pagina-11.jpg" alt="Página 11: referencias" loading="lazy"></figure>
    <figure class="page"><img src="assets/pages/pagina-12.jpg" alt="Página 12: código de honor" loading="lazy"></figure>
  </main>
  <footer><span>Love Yourself · {{BLOG_AUTHOR}}</span><a href="../../">Volver a My Blogs ↑</a></footer>
</body>
</html>
