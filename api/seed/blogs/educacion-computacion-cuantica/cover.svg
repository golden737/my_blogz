    <circle cx="150" cy="150" r="48" fill="url(#core)"/>
    <circle cx="83" cy="77" r="11" fill="#b7a9ff"/><circle cx="219" cy="81" r="11" fill="#55e7d9"/><circle cx="149" cy="264" r="11" fill="#b7a9ff"/>
