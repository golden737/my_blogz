  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <g fill="none" stroke="#6da8ff" stroke-opacity=".3" stroke-width="3"><path d="M690 82h86l32 32v52h64l36 36h196M704 414h78l44-44h70l34-34h170M835 70v66m-18 0h36M1081 312v58m-18 0h36"/><circle cx="690" cy="82" r="7" fill="#7de7dc"/><circle cx="1102" cy="202" r="7" fill="#7de7dc"/></g>
