services:
  - type: web
    name: myblogs-api
    runtime: node
    plan: free
    buildCommand: npm install --prefix api
    startCommand: npm --prefix api start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://myblogs-api-e3f9.onrender.com,https://golden737.github.io
      - key: SITE_BASE_URL
        value: https://myblogs-api-e3f9.onrender.com/
      - key: INITIAL_ADMIN_NAME
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
